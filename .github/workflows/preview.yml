name: preview

# PR ごとに Storybook のプレビュー（Worker Previews の pr-<番号>）を作り、PR を閉じたら消す
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  WRANGLER_VERSION: 4.155.0
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  publish:
    # fork からの PR には secret が渡らないので動かさない
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Storybook と wrangler の CLI は Node で動く
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Storybook
        run: bun run build-storybook

      - name: Publish preview
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/preview.out"
          bunx "wrangler@$WRANGLER_VERSION" preview --name "$PREVIEW_NAME" --json > "$out"
          cat "$out"
          # --json でも静的アセットのアップロードのログが先に出るので、JSON の部分だけを読む
          url="$(sed -n '/^{/,$p' "$out" | jq -er '.preview.urls[0]')"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Check that the preview is behind Cloudflare Access
        run: ./.github/scripts/assert-behind-access.sh "${{ steps.publish.outputs.url }}"

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.publish.outputs.url }}
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body-file - <<EOF
          Storybook のプレビュー: $URL

          WARP（shirayukihime）につながった端末からだけ開けます。
          EOF

  teardown:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Worker の名前は wrangler.jsonc から読む
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Delete preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx "wrangler@$WRANGLER_VERSION" preview delete --name "$PREVIEW_NAME" --skip-confirmation

      - name: Update comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "Storybook のプレビュー（$PREVIEW_NAME）は、PR を閉じたので削除しました。"
